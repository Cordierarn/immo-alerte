name: Veille immo

on:
  schedule:
    # Créneaux voulus, heure de PARIS : 8h, 10h, 12h, 13h, 15h, 18h, 20h.
    # Le cron GitHub ne connaît que l'UTC, et Paris est à UTC+2 l'été / UTC+1
    # l'hiver. On déclenche donc sur l'union des deux décalages possibles
    # (UTC 6-14 et 16-19), deux fois par heure pour absorber les retards de
    # GitHub, et c'est config.json ('heures') qui retient les 7 bons passages.
    # Les runs hors créneau ne coûtent rien : ils s'arrêtent avant tout appel.
    - cron: "5,35 6-14,16-19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Scanner les annonces (logement + parking)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_PARKING: ${{ secrets.NTFY_TOPIC_PARKING }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: python immo_alerte.py

      - name: Sauvegarder la mémoire des annonces vues et le budget
        run: |
          git config user.name "immo-alerte-bot"
          git config user.email "actions@users.noreply.github.com"
          # geo_cache.json : identifiants de zone Bien'ici et g-codes PAP.
          # Le committer évite de les redemander commune par commune à
          # chaque passage, ce qui dominait le temps d'exécution une fois la
          # zone passée à une trentaine de communes.
          git add seen.json seen_parking.json budget.json geo_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "maj: annonces vues"
            # budget.json bouge à chaque appel payant : en cas de course avec
            # le runner local, la version distante (plus avancée) fait foi.
            git pull --rebase -X theirs || git rebase --skip
            git push
          fi

      - name: Consommation de crédits Scrapfly
        if: always()
        run: python immo_alerte.py --budget
